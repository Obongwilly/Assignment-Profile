<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glide</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <p>Glide</p>
      </div>
      <ul>
        <li>Products</li>
        <li>Enterprise</li>
        <li>Customers</li>
        <li>Resources</li>
        <li>Pricing</li>
      </ul>
      <div class="btn-container">
        <button class="trans-btn">Log in</button>
        <button class="trans-btn">Contact sales</button>
        <button class="black-btn">Start for Free</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div id="left  ">
          <p>Inventory Management Software</p>
          <h1>Build custom inventory management software with AI</h1>
          <p>
            Stay ahead of demand, prevent stockouts, and streamline fulfillment
            with AI-powered software tailored to how you move inventory.
          </p>

          <div>
            <select name="Text" id="" aria-placeholder=""></select>
            <button>Upload spreadsheet</button>
            <button>Build App</button>
          </div>
        </div>

        <div id="right"><img src="Image profile.jpg" alt="" /></div>
      </section>
    </main>
  </body>
</html>
