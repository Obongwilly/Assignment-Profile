<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glide</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <p>Glide</p>
      </div>
      <ul>
        <li>Products</li>
        <li>Enterprise</li>
        <li>Customers</li>
        <li>Resources</li>
        <li>Pricing</li>
      </ul>
      <div class="btn-container">
        <button class="trans-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="trans-btn">Log in</button>
        <button class="trans-btn">Contact sales</button>
        <button class="black-btn">Start for Free</button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div id="left">
          <div>
            <p class="thick">Inventory Management Software</p>

            <h1>Build custom inventory management software with AI</h1>

            <p class="Increase">
              Stay ahead of demand, prevent stockouts, and streamline
              fulfillment with AI-powered software tailored to how you move
              inventory.
            </p>

            <div class="search">
              <textarea
                name="text"
                placeholder="Describe what you want to Build....."
                id=""
              ></textarea>
              <div class="btn">
                <button class="trans-btn">
                  <i class="fa-solid fa-paperclip"></i>
                  Upload spreadsheet
                </button>
                <button class="black-btn">Build app</button>
              </div>
            </div>
          </div>
        </div>
        <div id="right">
          <img src="Image profile.jpg" alt="Glide image" />
        </div>
      </section>
    </main>
  </body>
</html>
